# Alpha Payments — Render Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: Alpha Payments Landing Page
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Public site URL — update after first deploy to your onrender.com URL or custom domain
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Resend over HTTPS — required on Render free (SMTP ports are blocked)
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TO
        sync: false
      - key: CONSOLE_USER
        sync: false
      - key: CONSOLE_PASSWORD
        sync: false
      - key: CONSOLE_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
